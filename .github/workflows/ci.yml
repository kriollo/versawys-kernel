name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    kernel:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
        steps:
            # Kernel y esqueleto lado a lado, igual que en local: phpstan lee app/ del esqueleto
            # y las pruebas del esqueleto corren contra este kernel
            - uses: actions/checkout@v7
              with:
                  path: versawys-kernel
            # Un cambio que rompe al esqueleto se prueba con la rama del esqueleto del mismo nombre
            - name: Rama del esqueleto
              id: esqueleto
              run: |
                  rama="${{ github.head_ref || github.ref_name }}"
                  if git ls-remote --exit-code --heads https://github.com/kriollo/versaWYS "$rama" > /dev/null; then
                      echo "ref=$rama" >> "$GITHUB_OUTPUT"
                  else
                      echo "ref=main" >> "$GITHUB_OUTPUT"
                  fi
            - uses: actions/checkout@v7
              with:
                  repository: kriollo/versaWYS
                  ref: ${{ steps.esqueleto.outputs.ref }}
                  path: versaWYS
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: intl, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, curl, fileinfo, zip
                  coverage: none

            - name: Kernel (formato, pruebas, análisis estático, auditoría)
              working-directory: versawys-kernel
              run: |
                  composer install --no-interaction --no-progress
                  composer check
                  composer audit

            - name: Pruebas del esqueleto contra este kernel
              working-directory: versaWYS
              run: |
                  # composer.json en la raíz (desde 2.9) o en versaWYS/ (esqueletos anteriores)
                  if [ ! -f composer.json ]; then cd versaWYS; fi
                  kernel=$(cd "$GITHUB_WORKSPACE/versawys-kernel" && pwd)
                  composer config repositories.kernel "{\"type\": \"path\", \"url\": \"$kernel\", \"options\": {\"symlink\": true}}"
                  composer require --no-interaction --no-progress -W "versawys/kernel:*@dev"
                  composer test
